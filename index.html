<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Radio Roperok</title>
    <!-- Подключаем официальный VK Bridge SDK -->
    <script src="https://unpkg.com"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: radial-gradient(circle at top, #11111a, #050508);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }
        .container {
            width: 100%;
            max-width: 360px;
            background: rgba(15, 15, 22, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 28px;
            padding: 30px 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9);
            text-align: center;
            border: 1px solid rgba(255, 51, 102, 0.08);
            flex-shrink: 0;
        }
        .logo-area {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: #7a00ff;
            margin-bottom: 8px;
            white-space: nowrap;
        }
        .subtitle {
            color: #62627a;
            font-size: 14px;
            margin-bottom: 35px;
            line-height: 1.3;
        }
        .player-card {
            background: linear-gradient(135deg, #181824, #0f0f16);
            border-radius: 24px;
            padding: 35px 20px;
            border: 1px solid #222231;
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease;
            display: block;
            text-decoration: none;
            color: #fff;
            margin-bottom: 20px;
        }
        .player-card:hover {
            transform: scale(1.02);
            border-color: rgba(122, 0, 255, 0.3);
        }
        
        .neon-circle-bg {
            width: 90px;
            height: 90px;
            background: #7a00ff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 25px auto;
            box-shadow: 0 8px 25px rgba(122, 0, 255, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            flex-shrink: 0;
        }
        
        .play-triangle {
            font-size: 36px;
            color: #e5e4e2;
            line-height: 1;
            margin-left: 6px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.4);
        }
        .player-card:hover .neon-circle-bg {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(122, 0, 255, 0.6);
        }
        
        .track-info {
            font-size: 19px;
            font-weight: 600;
            margin-bottom: 5px;
            color: #e5e4e2;
            letter-spacing: 0.5px;
        }
        
        .track-artist {
            font-size: 14px;
            color: #62627a;
            margin-bottom: 15px;
            font-weight: 500;
        }
        
        .stream-status {
            font-size: 11px;
            color: #00ff66; 
            text-transform: uppercase;
            letter-spacing: 2px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            font-weight: 700;
        }
        .stream-status::before {
            content: '';
            width: 7px;
            height: 7px;
            background: #00ff66;
            border-radius: 50%;
            box-shadow: 0 0 10px #00ff66;
            animation: blink 1.5s infinite;
        }
        @keyframes blink {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }

        .promo-btn {
            display: block;
            background: transparent;
            color: #7a00ff;
            border: 1px dashed rgba(122, 0, 255, 0.4);
            padding: 12px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: background 0.2s, color 0.2s, border-style 0.2s;
            margin-bottom: 25px;
            cursor: pointer;
        }
        .promo-btn:hover {
            background: linear-gradient(135deg, #7a00ff, #0044ff);
            color: #fff;
            border-style: solid;
        }
        .footer {
            font-size: 13px;
            color: #4a4a5e;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo-area">Radio Roperok</div>
    <div class="subtitle">Атмосферный саунд, ночной вайб и независимые артисты</div>

    <!-- Кнопка плеера -->
    <div class="player-card" id="playerBtn">
        <div class="neon-circle-bg">
            <div class="play-triangle" id="playIcon">▶</div>
        </div>
        <div class="track-info" id="trackTitle">Нажмите Play</div>
        <div class="track-artist" id="trackArtist">для запуска эфира</div>
        <div class="stream-status">ЭФИР LIVE</div>
    </div>

    <!-- Кнопка связи через VK Bridge -->
    <div id="promoBtn" class="promo-btn">
        🚀 Предложить свой трек в ротацию
    </div>

    <div class="footer">
        Личный отбор треков от Roperok.<br>Слушай правильную музыку.
    </div>
</div>

<script>
    // Инициализируем сервис при старте, чтобы VK Mini Apps не зависал
    vkBridge.send("VKWebAppInit", {});

    // ==========================================
    // НАШ ПЛЕЙЛИСТ (Сюда вставляй ссылки на свои треки)
    // ==========================================
    const playlist = [
        {
            title: "Из села",
            artist: "Roperok",
            url: "https://soundhelix.com"
        },
        {
            title: "Стена из звука",
            artist: "Roperok",
            url: "https://soundhelix.com"
        }
    ];

    let currentTrackIndex = 0;
    const audio = new Audio();
    let isPlaying = false;

    const playerBtn = document.getElementById('playerBtn');
    const playIcon = document.getElementById('playIcon');
    const trackTitle = document.getElementById('trackTitle');
    const trackArtist = document.getElementById('trackArtist');
    const promoBtn = document.getElementById('promoBtn');

    function loadTrack(index) {
        const track = playlist[index];
        audio.src = track.url;
        trackTitle.textContent = track.title;
        trackArtist.textContent = track.artist;
    }

    playerBtn.addEventListener('click', () => {
        if (isPlaying) {
            audio.pause();
            playIcon.textContent = '▶';
        } else {
            if(!audio.src) {
                loadTrack(currentTrackIndex);
            }
            audio.play().catch(e => console.log("Ошибка воспроизведения:", e));
            playIcon.textContent = '⏸';
        }
        isPlaying = !isPlaying;
    });

    audio.addEventListener('ended', () => {
        currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
        loadTrack(currentTrackIndex);
        audio.play().catch(e => console.log(e));
    });

    // Безопасное открытие диалога с сообществом через встроенные инструменты ВК
    promoBtn.addEventListener('click', () => {
        vkBridge.send("VKWebAppOpenURL", {
            "url": "https://vk.com"
        });
    });
</script>

</body>
</html>
